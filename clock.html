<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Clock</title>
  <style>
    :root { color-scheme: dark; --bg:#08111f; --card:#111f33; --line:#263b56; --text:#f4f7fb; --muted:#9eb0c7; --accent:#63b3ed; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--text); background:radial-gradient(circle at top,#18365b 0,#08111f 52%); font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,960px); }
    header { display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom:22px; }
    h1 { margin:0; font-size:clamp(2rem,5vw,3.3rem); letter-spacing:-.04em; }
    .date { color:var(--muted); margin:.4rem 0 0; }
    .status { color:var(--accent); font-size:.85rem; white-space:nowrap; }
    .clocks { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
    .clock { padding:20px; border:1px solid var(--line); border-radius:18px; background:linear-gradient(145deg,rgba(21,40,66,.96),rgba(12,25,43,.96)); box-shadow:0 16px 40px rgba(0,0,0,.2); }
    .clock.local { border-color:var(--accent); box-shadow:0 0 0 1px rgba(99,179,237,.2),0 16px 40px rgba(0,0,0,.2); }
    .place { display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:.9rem; }
    .zone { color:var(--accent); font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; }
    time { display:block; margin:14px 0 7px; font-variant-numeric:tabular-nums; font-size:clamp(2rem,6vw,3rem); font-weight:700; letter-spacing:-.05em; }
    .offset { color:var(--muted); font-size:.82rem; }
    footer { margin-top:20px; color:var(--muted); font-size:.8rem; text-align:center; }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>World clock</h1><p class="date" id="date">—</p></div>
      <div class="status">● Live</div>
    </header>
    <section class="clocks" id="clocks" aria-label="Current time in different time zones"></section>
    <footer>Times update every second using your browser's timezone data.</footer>
  </main>
  <script>
    const zones = [
      { city: 'Local time', zone: Intl.DateTimeFormat().resolvedOptions().timeZone, local: true },
      { city: 'New York', zone: 'America/New_York' },
      { city: 'London', zone: 'Europe/London' },
      { city: 'Tokyo', zone: 'Asia/Tokyo' },
      { city: 'Sydney', zone: 'Australia/Sydney' },
      { city: 'Dubai', zone: 'Asia/Dubai' }
    ];
    const clocks = document.querySelector('#clocks');
    const cards = zones.map(({ city, zone, local }) => {
      const card = document.createElement('article');
      card.className = `clock${local ? ' local' : ''}`;
      card.innerHTML = `<div class="place"><span>${city}</span><span class="zone">${zone.replace('_', ' ')}</span></div><time datetime="" aria-label="Current time">—</time><div class="offset"></div>`;
      clocks.append(card);
      return { card, zone };
    });
    const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
    const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    function update() {
      const now = new Date();
      document.querySelector('#date').textContent = new Intl.DateTimeFormat(undefined, dateOptions).format(now);
      cards.forEach(({ card, zone }) => {
        const time = card.querySelector('time');
        const formatted = new Intl.DateTimeFormat(undefined, { ...timeOptions, timeZone: zone }).format(now);
        time.textContent = formatted;
        time.dateTime = now.toISOString();
        card.querySelector('.offset').textContent = new Intl.DateTimeFormat(undefined, { timeZone: zone, timeZoneName: 'longOffset' }).formatToParts(now).find(part => part.type === 'timeZoneName')?.value || zone;
      });
    }
    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
